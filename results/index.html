<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gunshot Case — ALS + MapLibre (animated)</title>

    <!-- MapLibre CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
      :root{ --blue:#1F77B4; --orange:#FF7F0E; --gray:#7F7F7F; }
      *{box-sizing:border-box}
      body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji"}
      #map{height:100vh}

      /* HUDs */
      .titlebar{
        position:fixed; z-index:12; left:12px; top:12px;
        background:#fff; padding:8px 12px; border-radius:8px;
        box-shadow:0 2px 8px rgba(0,0,0,.15); font-weight:600;
      }
      .legend{
        position:fixed; z-index:12; left:12px; top:58px;
        background:#fff; padding:8px 10px; border-radius:8px;
        box-shadow:0 2px 8px rgba(0,0,0,.15); display:flex; gap:12px; align-items:center; flex-wrap:wrap;
      }
      .chip{display:inline-flex; align-items:center; gap:6px; font-size:14px}
      .dot{width:10px;height:10px;border-radius:50%}
      .dot.blue{background:var(--blue)}
      .dot.orange{background:var(--orange)}
      .dot.gray{background:var(--gray)}
      .muted{color:#666}

      .controls{
        position:fixed; z-index:12; left:12px; bottom:12px;
        background:#fff; padding:10px; border-radius:10px; width:min(520px,92vw);
        box-shadow:0 2px 10px rgba(0,0,0,.18);
      }
      .controls .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
      .controls button{padding:6px 10px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer}
      .controls button:active{transform:translateY(1px)}
      .controls .range{width:100%; margin-top:6px}
      .ticks{display:flex; justify-content:space-between; font-size:11px; color:#666; margin-top:2px}

      /* Popup text */
      .pop{font:12px/1.3 system-ui,Segoe UI,Roboto,Helvetica,Arial}
      .pop .k{color:#666}
      .xgb-banner{
        position:fixed; z-index:13; left:12px; top:100px; max-width:min(440px,92vw);
        background:#fde8e8; border:1px solid #b00020; color:#5c0011;
        padding:10px 14px; border-radius:8px; font-size:14px; font-weight:600;
        box-shadow:0 2px 8px rgba(0,0,0,.12);
      }
      .xgb-banner .banner-title{ font-size:15px; margin-bottom:4px }
      .xgb-banner .banner-detail{ font-weight:400; font-size:13px; color:#7c1520; display:flex; gap:10px; align-items:center; flex-wrap:wrap }
      .prob-bar-wrap{ display:inline-flex; align-items:center; gap:6px }
      .prob-bar{ width:90px; height:8px; background:#f8b4bb; border-radius:4px; overflow:hidden }
      .prob-bar-fill{ height:100%; background:#b00020; border-radius:4px; transition:width .25s }
      .srv-dot{ width:8px; height:8px; border-radius:50%; display:inline-block }
      .srv-dot.live{ background:#22c55e }
      .srv-dot.precomp{ background:#94a3b8 }
    </style>
  </head>

  <body>
    <div class="titlebar" id="title">
      Gunshot Case — demo window (2.5s cadence) + XGBoost alerts
    </div>

    <div id="xgbBanner" class="xgb-banner" style="display:none">
      <div class="banner-title">⚠ GUNSHOT DETECTED</div>
      <div class="banner-detail">
        <span class="prob-bar-wrap">
          <span class="prob-bar"><span id="probFill" class="prob-bar-fill" style="width:0%"></span></span>
          <span id="probLabel">–</span>
        </span>
        <span>threshold <span id="thrLabel">–</span></span>
        <span id="latencyLabel"></span>
      </div>
    </div>

    <!-- Legend: only Still / Walk / Run (no Dead, no Alive) -->
    <div class="legend" id="legend">
      <span class="chip"><span class="dot gray"></span> Still (<span id="cnt-still">0</span>)</span>
      <span class="chip"><span class="dot blue"></span> Walk (<span id="cnt-walk">0</span>)</span>
      <span class="chip"><span class="dot orange"></span> Run (<span id="cnt-run">0</span>)</span>
    </div>

    <div class="controls">
      <div class="row">
        <button id="playBtn">Play</button>
        <button id="pauseBtn">Pause</button>
        <span class="muted">t = <span id="tLabel">0.0</span>s</span>
        <span class="muted" style="margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px">
          <span id="srvDot" class="srv-dot precomp"></span>
          <span id="srvLabel">precomputed</span>
        </span>
      </div>
      <input id="timeSlider" class="range" type="range" min="0" max="10" step="1" value="0">
      <div id="tickRow" class="ticks"></div>
    </div>

    <div id="map"></div>

    <!-- MapLibre + AWS helper -->
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@aws/amazon-location-utilities-auth-helper@1.x/dist/amazonLocationAuthHelper.js"></script>

    <script>
      // ========= 1) YOUR AWS RESOURCES (keep these) =========
      const identityPoolId = "us-west-2:dcb9a81c-6b9a-4c72-a288-dd1a7e83e4ff";
      const mapName        = "GunshotDemoMap";
      const region         = identityPoolId.split(":")[0];

      // ========= 2) CONFIG =========
      const DATA_URL    = "./out/gunshot_points_all.geojson"; // keep relative
      const ALERT_URL   = "./out/xgb_alerts.json";
      const FEAT_URL    = "./out/features_demo_window.json";
      const SCORES_URL  = "./out/xgb_scores_demo_window.json";
      const SERVER_URL  = "http://localhost:8001/2015-03-31/functions/function/invocations";
      const MAP_CENTER  = [-121.7493613, 38.5411082];       // lon,lat
      const STEP_MS     = 600;                               // animation speed

      // ========= 3) GEO helpers =========
      function haversineMeters(lon1, lat1, lon2, lat2){
        const R = 6378137; // meters
        const toRad = (d)=> d*Math.PI/180;
        const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
        const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
        return 2*R*Math.asin(Math.sqrt(a));
      }

      // ========= 4) MAIN =========
      (async function main(){
        // Auth + map init
        const authHelper = await amazonLocationAuthHelper.withIdentityPoolId(identityPoolId);
        const map = new maplibregl.Map({
          container: "map",
          center: MAP_CENTER,
          zoom: 16,
          style: `https://maps.geo.${region}.amazonaws.com/maps/v0/maps/${mapName}/style-descriptor`,
          ...authHelper.getMapAuthenticationOptions()
        });
        map.addControl(new maplibregl.NavigationControl(), "top-left");

        // Load your GeoJSON (features have phone_id + t)
        const full = await fetch(DATA_URL).then(r => r.json());

        let alertsMeta = { xgb_alert_times_s: [] };
        try {
          alertsMeta = await fetch(ALERT_URL).then(r => r.json());
        } catch (e) {
          console.warn("xgb_alerts.json not loaded:", e);
        }
        function isXgbAlertAt(t){
          const tnum = Number(t);
          const list = alertsMeta.xgb_alert_times_s || [];
          return list.some(at => Math.abs(at - tnum) < 1.5);
        }

        // ── Feature window + server setup ─────────────────────────────────────
        let featData = null;          // {feature_names, sortedRows:[{t,row},...]}
        let scoreData = null;         // {threshold, sortedRows:[{t, proba, pred, inference_ms},...]}
        let serverLive = false;
        let serverThreshold = null;
        let inflight = false;         // debounce: skip call if previous still pending

        try {
          const raw = await fetch(FEAT_URL).then(r => r.json());
          // Build sorted array for nearest-t lookup
          const sortedRows = Object.entries(raw.rows)
            .map(([k, v]) => ({ t: parseFloat(k), row: v }))
            .sort((a, b) => a.t - b.t);
          featData = { featureNames: raw.feature_names, sortedRows };
          console.log(`Loaded ${sortedRows.length} feature rows for demo window`);
        } catch (e) {
          console.warn("features_demo_window.json not loaded (run build_demo_features_json.py):", e);
        }

        try {
          const raw = await fetch(SCORES_URL).then(r => r.json());
          const sortedRows = Object.entries(raw.rows)
            .map(([k, v]) => ({ t: parseFloat(k), ...v }))
            .sort((a, b) => a.t - b.t);
          scoreData = { threshold: raw.threshold, sortedRows };
          console.log(`Loaded ${sortedRows.length} precomputed score rows`);
        } catch (e) {
          console.warn("xgb_scores_demo_window.json not loaded (run build_demo_scores_json.py):", e);
        }

        // Ping server health once; update indicator
        try {
          const h = await fetch(`${SERVER_URL.replace(/\/2015.*/, "")}/health`,
                                { signal: AbortSignal.timeout(800) }).then(r => r.json());
          if (h.status === "ok") {
            serverLive = true;
            serverThreshold = h.threshold;
            document.getElementById("srvDot").className   = "srv-dot live";
            document.getElementById("srvLabel").textContent = "server live";
            console.log("Inference server is live, threshold=", h.threshold);
          }
        } catch (_) {
          console.info("Inference server not reachable — using precomputed alerts");
        }

        // Find nearest feature row to GPS time t (within 2 s)
        function nearestFeatRow(t) {
          if (!featData) return null;
          const arr = featData.sortedRows;
          let best = null, bestDt = Infinity;
          for (const entry of arr) {
            const dt = Math.abs(entry.t - t);
            if (dt < bestDt) { bestDt = dt; best = entry; }
            if (entry.t > t + 2) break;
          }
          return (best && bestDt <= 2.0) ? best.row : null;
        }

        // Find nearest precomputed score entry to GPS time t (within 2 s)
        function nearestScore(t) {
          if (!scoreData) return null;
          const arr = scoreData.sortedRows;
          let best = null, bestDt = Infinity;
          for (const entry of arr) {
            const dt = Math.abs(entry.t - t);
            if (dt < bestDt) { bestDt = dt; best = entry; }
            if (entry.t > t + 2) break;
          }
          return (best && bestDt <= 2.0) ? best : null;
        }

        // Async server call — fire-and-forget; updates banner when response arrives
        async function callServer(t) {
          if (!serverLive || !featData || inflight) return;
          const row = nearestFeatRow(t);
          if (!row) return;
          inflight = true;
          try {
            const t0 = performance.now();
            const resp = await fetch(SERVER_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ features: [row], feature_names: featData.featureNames }),
              signal: AbortSignal.timeout(2000),
            });
            const envelope = await resp.json();
            const data = (typeof envelope.body === "string")
              ? JSON.parse(envelope.body) : envelope;
            const latency = Math.round(performance.now() - t0);
            const prob = data.proba[0];
            const thr  = serverThreshold ?? data.threshold;
            updateBanner(prob >= thr, prob, thr, `${latency} ms`);
          } catch (_) {
            // Server went away mid-demo — fall back silently
            serverLive = false;
            document.getElementById("srvDot").className    = "srv-dot precomp";
            document.getElementById("srvLabel").textContent = "precomputed";
          } finally {
            inflight = false;
          }
        }

        // Update the banner UI elements
        function updateBanner(show, prob, thr, latencyStr) {
          const xb = document.getElementById("xgbBanner");
          if (!xb) return;
          if (show) {
            if (prob !== null && thr !== null) {
              const pct = Math.round(prob * 100);
              document.getElementById("probFill").style.width = `${pct}%`;
              document.getElementById("probLabel").textContent = `${pct}%`;
              document.getElementById("thrLabel").textContent  = thr.toFixed(3);
              document.getElementById("latencyLabel").textContent = latencyStr || "";
            } else {
              // Precomputed fallback — no probability available
              document.getElementById("probFill").style.width = "100%";
              document.getElementById("probLabel").textContent = "–";
              document.getElementById("thrLabel").textContent  = "–";
              document.getElementById("latencyLabel").textContent = latencyStr || "";
            }
            xb.style.display = "block";
          } else {
            xb.style.display = "none";
          }
        }

        // Collect unique times & build quick lookup by (phone,t)
        const TIMES = Array.from(new Set(full.features.map(f => f.properties.t))).sort((a,b)=>a-b);
        const indexByPhoneTime = new Map(); // key = `${phone}|${t}` -> [lng,lat]
        for(const f of full.features){
          const p = f.properties || {};
          const phone = String(p.phone_id ?? p.imei ?? "");
          const t = Number(p.t);
          indexByPhoneTime.set(`${phone}|${t}`, f.geometry.coordinates);
        }

        // Build slider ticks
        const tickRow = document.getElementById("tickRow");
        const fmt = (n)=> Number.parseFloat(n).toFixed(1);
        tickRow.innerHTML = TIMES.map((t,i)=> `<span>${(i%2===0)? fmt(t)+"s" : " "}</span>`).join("");

        // HUD refs
        const tLabel = document.getElementById("tLabel");
        const cntStill = document.getElementById("cnt-still");
        const cntWalk  = document.getElementById("cnt-walk");
        const cntRun   = document.getElementById("cnt-run");
        const slider   = document.getElementById("timeSlider");
        slider.max = TIMES.length - 1;

        // Popup on hover
        const popup = new maplibregl.Popup({closeButton:false, closeOnClick:false});
        map.on("mouseenter", "phones-dots", ()=> map.getCanvas().style.cursor = "pointer");
        map.on("mouseleave", "phones-dots", ()=> { map.getCanvas().style.cursor = ""; popup.remove(); });
        map.on("mousemove", "phones-dots", (e)=>{
          const f = e.features && e.features[0];
          if(!f) return;
          const p = f.properties || {};
          const html = `<div class="pop">
            <div><span class="k">phone:</span> ${p.phone_id ?? p.imei ?? "?"}</div>
            <div><span class="k">state:</span> ${p.cat ?? "?"}</div>
            <div><span class="k">t:</span> ${fmt(p.t)} s</div>
            <div><span class="k">lon:</span> ${fmt(e.lngLat.lng)} • <span class="k">lat:</span> ${fmt(e.lngLat.lat)}</div>
          </div>`;
          popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
        });

        map.on("load", () => {
          // One source + layer; we will replace source data each frame with computed categories
          map.addSource("phones", { type:"geojson", data: {type:"FeatureCollection", features:[]} });

          map.addLayer({
            id:"phones-dots",
            type:"circle",
            source:"phones",
            paint:{
              "circle-radius":4,
              "circle-stroke-width":1,
              "circle-stroke-color":"#00000040",
              "circle-color":[
                "match", ["get","cat"],
                "run",   "#FF7F0E",
                "walk",  "#1F77B4",
                "still", "#7F7F7F",
                /* other */ "#666"
              ]
            }
          });

          let idx = 0;
          let timer = null;

          function frameDataForTime(t){
            const tIdx = TIMES.indexOf(t);
            const tPrev = (tIdx>0) ? TIMES[tIdx-1] : null;

            let still=0, walk=0, run=0;
            const feats = [];

            const featsNow = full.features.filter(f => f.properties.t === t);
            for(const f of featsNow){
              const p = f.properties || {};
              const phone = String(p.phone_id ?? p.imei ?? "");
              const [lng,lat] = f.geometry.coordinates;

              // Speed from previous frame (if any)
              let speed = 0;
              if (tPrev !== null){
                const prev = indexByPhoneTime.get(`${phone}|${tPrev}`);
                if (prev){
                  const dist = haversineMeters(prev[0], prev[1], lng, lat); // meters
                  const dt = t - tPrev; // seconds
                  speed = (dt>0)? (dist/dt) : 0;
                }
              }

              // Classify (m/s): run >=1.7, walk >0, else still
              let cat = "still";
              if (speed >= 1.7) cat = "run";
              else if (speed > 0) cat = "walk";

              if (cat==="run") run++; else if (cat==="walk") walk++; else still++;

              feats.push({
                type:"Feature",
                geometry:{ type:"Point", coordinates:[lng,lat] },
                properties:{
                  phone_id: phone,
                  t: t,
                  cat: cat
                }
              });
            }
            return { fc:{type:"FeatureCollection", features:feats}, counts:{still,walk,run} };
          }

          function showIndex(i){
            idx = Math.max(0, Math.min(TIMES.length-1, i));
            const t = TIMES[idx];

            const {fc, counts} = frameDataForTime(t);
            const src = map.getSource("phones");
            if (src) src.setData(fc);

            // HUD updates
            tLabel.textContent = fmt(t);
            slider.value = String(idx);
            cntStill.textContent = counts.still;
            cntWalk.textContent  = counts.walk;
            cntRun.textContent   = counts.run;

            if (serverLive) {
              // Live path: async server call updates banner when it returns
              callServer(t);
            } else {
              // Fallback: precomputed alerts + precomputed latency
              const score = nearestScore(t);
              const latStr = score
                ? `~${score.inference_ms.toFixed(1)} ms (precomputed)`
                : "(precomputed)";
              updateBanner(isXgbAlertAt(t), null, null, latStr);
            }
          }

          function play(){
            if (timer) return;
            timer = setInterval(() => {
              idx = (idx + 1) % TIMES.length;
              showIndex(idx);
            }, STEP_MS);
          }
          function pause(){ if (timer){ clearInterval(timer); timer=null; } }

          // Wire controls
          document.getElementById("playBtn").onclick  = play;
          document.getElementById("pauseBtn").onclick = pause;
          slider.oninput = (e)=>{ pause(); showIndex(parseInt(e.target.value,10)); };

          // Start
          showIndex(0);
          play();
        });
      })();
    </script>
  </body>
</html>
